<!DOCTYPE html>
<html>
    <head>
        <title>Road SOS</title>

        <style>
            body{
                font-family:arial;
                background-color:#0F172A;
            }

            .top{
                position: sticky;
                top: 0;
                background-color: #1E293B;
                padding: 15px 0;
                z-index: 1000;
            }
                

            .logo{
                font-size:50px;
                font-weight:bold;
                color:#38BDF8;
                text-align:center;
            }

            .header{
                font-size:30px;
                font-weight:bold;
                text-align:center;
                color:#F8FAFC;
                margin-top:25px;
            }

            .message{
                font-size:20px;
                text-align:center;
                color:#F8FAFC;
            }

            .sos-btn{
                display:flex;
                justify-content:center;
                align-items:center;
                margin-top:30px;
            }
            .sos-button{
                font-size:25px;
                padding:15px;
                border-radius:50px;
                color:#F8FAFC;
                background-color:#EF4444;
                border:none;
                cursor:pointer;
                box-shadow: 0 0 15px #EF4444,
                0 0 30px #EF4444;
            }

            .sos-button:hover{
                background-color:#DC2626;
            }
            .sos-button:active{
                opacity:0.5;
            }

            .display{
                color:#F8FAFC;
                font-size:15px;
                text-align:center;
            }
            .container{
                display:flex;
                justify-content:center;
                gap:100px;
                margin-top:35px;
            }

            .box{
                width:300px;
                height:250px;
                background-color:#1E293B;
                padding:20px;
                color:white;
                box-sizing:border-box;
            } 

            .box button{
                background-color:#38BDF8;
                color:white;
                border:none;
                padding:9px;
                border-radius:8px;
                cursor:pointer;
                
            }

            .box button:hover{
                background-color:#0EA5E9;
            }

            .one{
                color:#F59E0B;
            }

            .box{
                transition:0.3s;
            }

            .box:hover{
                transform:translateY(-10px);
                box-shadow:0 0 20px #38BDF8;
            }


            #locationText{
                word-wrap: break-word;
                line-height: 1.5;
                font-size: 14px;
            }

            
        </style>


    </head>

    <body>
        <div class="top">
            <div class="logo">🚨 Road Safety SOS</div>
        </div>

        
        <p class="header">
            Smart Road Safety &
            Emergency Response System
        </p>

        <p class="message">
            One click SOS assistance with location awareness.
        </p>

        <div class="sos-btn">
            <button class="sos-button" onclick="sendSOS()">SEND SOS</button>
        </div>

        <p class="display" id="clock"></p>
        <p class="display" id="countdown"></p>

        <div class="container">
            <div class="box">
                <h3 class="one">Location</h3>

                <button onclick="getLocation()">
                    Detect Location
                </button>

                <p id="locationText">
                    Location not detected
                </p>

                <button id="hospitalBtn"
                        onclick="findHospitals()"
                        style="display:none;">
                    Nearby Hospitals
                </button>
            </div>

            <div class="box">
                <h3 class="one">Nearby Hospital</h3>
                <p>City Hospital</p>
                <p>Apollo Care</p>
                <p>Emergency Trauma Center</p>
            </div>


            <div class="box">
                <h3 class="one">Emergency Contacts</h3>
                <p>police : 100</p>
                <p>Ambulance : 108</p>
            </div>
        </div>
    </body>

    <script>
        function sendSOS(){
            alert("🚨 SOS Alert Sent Successfully!");

            let count=5;
            const timer = setInterval(()=>{
                document.getElementById("countdown").innerHTML =
                "Sending SOS in " + count;

                count--;

                if(count < 0){
                    clearInterval(timer);
                    document.getElementById("countdown").innerHTML =
                    "🚨 SOS Sent!";
                }
            },1000);

            if(userLat && userLng){
                alert(
                `🚨 SOS Activated!\n\nLocation:\nLatitude: ${userLat}\nLongitude: ${userLng}`
                );
            }else{
                alert("Please detect location first.");

            }
        }
        

        
        let userLat;
        let userLng;

        function getLocation(){

            if(navigator.geolocation){

                navigator.geolocation.getCurrentPosition(
                    showPosition,
                    function(){
                        alert("Unable to get location");
                    }
                );

            }else{
                alert("Geolocation is not supported.");
            }
        }

        async function showPosition(position){

            userLat = position.coords.latitude;
            userLng = position.coords.longitude;

            try{

                const response = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`
                );

                const data = await response.json();

                document.getElementById("locationText").innerHTML =
                `
                📍 ${data.display_name}
                `;

                document.getElementById("hospitalBtn").style.display =
                "inline-block";

            }
            catch(error){

                document.getElementById("locationText").innerHTML =
                "Unable to fetch address.";
            }
        }

        function findHospitals(){

            const mapsUrl =
            `https://www.google.com/maps/search/hospitals/@${userLat},${userLng},15z`;

            window.open(mapsUrl,"_blank");
        }


        setInterval(()=>{
            const now = new Date();
            document.getElementById("clock").innerHTML =
                now.toLocaleTimeString();
        },1000);
        

    </script>
</html>
